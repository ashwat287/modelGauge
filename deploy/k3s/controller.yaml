apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelgauge-controller
  namespace: benchmark-system
  labels:
    app.kubernetes.io/name: modelgauge-controller
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: modelgauge-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modelgauge-controller
    spec:
      containers:
        - name: controller
          image: ghcr.io/nerdylucifer/modelgauge:dev
          imagePullPolicy: IfNotPresent
          args: ["server", "--listen", ":8080"]
          env:
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: benchmark-controller-db
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: benchmark-controller-db
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: benchmark-controller-db
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: benchmark-controller-db
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: benchmark-controller-db
                  key: DATABASE_PASSWORD
            - name: MODELGAUGE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: modelgauge-agent-auth
                  key: token
            - name: MODELGAUGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: modelgauge-admin-auth
                  key: token
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: modelgauge-controller
  namespace: benchmark-system
  labels:
    app.kubernetes.io/name: modelgauge-controller
    app.kubernetes.io/component: control-plane
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: modelgauge-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 31080
