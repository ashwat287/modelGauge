# Copy this file to secrets.local.yaml, replace every CHANGE_ME value, then apply it.
# secrets.local.yaml is ignored by Git and must never be committed.
apiVersion: v1
kind: Secret
metadata:
  name: benchmark-postgres-auth
  namespace: benchmark-data
type: Opaque
stringData:
  POSTGRES_DB: benchmark
  POSTGRES_USER: benchmark_app
  POSTGRES_PASSWORD: CHANGE_ME_LONG_RANDOM_POSTGRES_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: benchmark-controller-db
  namespace: benchmark-system
type: Opaque
stringData:
  DATABASE_HOST: benchmark-postgres.benchmark-data.svc.cluster.local
  DATABASE_PORT: "5432"
  DATABASE_NAME: benchmark
  DATABASE_USER: benchmark_app
  DATABASE_PASSWORD: CHANGE_ME_SAME_POSTGRES_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: modelgauge-agent-auth
  namespace: benchmark-system
type: Opaque
stringData:
  token: CHANGE_ME_LONG_RANDOM_AGENT_TOKEN
---
apiVersion: v1
kind: Secret
metadata:
  name: modelgauge-admin-auth
  namespace: benchmark-system
type: Opaque
stringData:
  token: CHANGE_ME_LONG_RANDOM_ADMIN_TOKEN
