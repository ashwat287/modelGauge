apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmark-controller-source
  namespace: benchmark-system
data:
  app.py: |
    import os
    from datetime import datetime, timezone
    from typing import Literal
    
    import psycopg
    from fastapi import FastAPI, Header, HTTPException
    from prometheus_client import Counter, Gauge, make_asgi_app
    from pydantic import BaseModel, Field
    from psycopg.types.json import Jsonb
    
    app = FastAPI(title="Benchmark Controller", version="0.1.0")
    
    REQUESTS = Counter(
        "benchmark_controller_requests_total",
        "Controller API requests",
        ["endpoint", "status"],
    )
    REGISTERED_NODES = Gauge(
        "benchmark_controller_registered_nodes",
        "Number of nodes registered through this controller process",
    )
    
    EXPECTED_NODE_ID = os.environ["EXPECTED_NODE_ID"]
    AGENT_TOKEN = os.environ["AGENT_TOKEN"]
    
    DB_CONFIG = {
        "host": os.environ["DATABASE_HOST"],
        "port": os.environ["DATABASE_PORT"],
        "dbname": os.environ["DATABASE_NAME"],
        "user": os.environ["DATABASE_USER"],
        "password": os.environ["DATABASE_PASSWORD"],
    }
    
    
    class NodeRegistration(BaseModel):
        node_id: str
        display_name: str
        node_kind: Literal["physical", "virtual"]
        execution_mode: Literal["native-isolated", "lima-linux"]
        hardware: dict = Field(default_factory=dict)
        agent_version: str = "0.1.0"
    
    
    class Heartbeat(BaseModel):
        status: Literal["online", "busy", "offline"]
        metrics: dict = Field(default_factory=dict)
    
    
    def authenticate(x_agent_token: str = Header(...)) -> None:
        if x_agent_token != AGENT_TOKEN:
            raise HTTPException(status_code=401, detail="invalid agent token")
    
    
    def connection():
        return psycopg.connect(**DB_CONFIG)
    
    
    @app.get("/healthz")
    def healthz():
        try:
            with connection() as conn:
                with conn.cursor() as cur:
                    cur.execute("SELECT 1")
                    cur.fetchone()
            return {"status": "ok", "database": "reachable"}
        except Exception as error:
            raise HTTPException(status_code=503, detail=f"database unavailable: {error}")
    
    
    @app.post("/v1/nodes/register")
    def register_node(payload: NodeRegistration, _: None = authenticate()):
        if payload.node_id != EXPECTED_NODE_ID:
            raise HTTPException(status_code=403, detail="node identity is not allowed")
    
        with connection() as conn:
            with conn.cursor() as cur:
                cur.execute(
                    """
                    INSERT INTO nodes (
                      node_id, display_name, node_kind, execution_mode,
                      hardware, agent_version, status, last_seen_at, updated_at
                    )
                    VALUES (%s, %s, %s, %s, %s, %s, 'online', now(), now())
                    ON CONFLICT (node_id) DO UPDATE SET
                      display_name = EXCLUDED.display_name,
                      node_kind = EXCLUDED.node_kind,
                      execution_mode = EXCLUDED.execution_mode,
                      hardware = EXCLUDED.hardware,
                      agent_version = EXCLUDED.agent_version,
                      status = 'online',
                      last_seen_at = now(),
                      updated_at = now()
                    """,
                    (
                        payload.node_id,
                        payload.display_name,
                        payload.node_kind,
                        payload.execution_mode,
                        Jsonb(payload.hardware),
                        payload.agent_version,
                    ),
                )
            conn.commit()
    
        REGISTERED_NODES.inc()
        REQUESTS.labels("/v1/nodes/register", "200").inc()
        return {"node_id": payload.node_id, "status": "registered"}
    
    
    @app.post("/v1/nodes/{node_id}/heartbeat")
    def heartbeat(node_id: str, payload: Heartbeat, _: None = authenticate()):
        if node_id != EXPECTED_NODE_ID:
            raise HTTPException(status_code=403, detail="node identity is not allowed")
    
        with connection() as conn:
            with conn.cursor() as cur:
                cur.execute(
                    """
                    UPDATE nodes
                    SET status = %s, last_seen_at = now(), updated_at = now()
                    WHERE node_id = %s
                    """,
                    (payload.status, node_id),
                )
                if cur.rowcount != 1:
                    raise HTTPException(status_code=404, detail="node is not registered")
            conn.commit()
    
        REQUESTS.labels("/v1/nodes/heartbeat", "200").inc()
        return {
            "node_id": node_id,
            "status": payload.status,
            "received_at": datetime.now(timezone.utc).isoformat(),
        }
    
    
    app.mount("/metrics", make_asgi_app())
  requirements.txt: |
    fastapi==0.118.0
    uvicorn[standard]==0.37.0
    psycopg[binary]==3.2.9
    prometheus-client==0.22.1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-controller
  namespace: benchmark-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benchmark-controller
  template:
    metadata:
      labels:
        app: benchmark-controller
    spec:
      containers:
        - name: controller
          image: python:3.13-slim
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              cd /app
              pip install --no-cache-dir -r /app/requirements.txt
              exec uvicorn app:app --host 0.0.0.0 --port 8080
          env:
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: benchmark-controller-db
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: benchmark-controller-db
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: benchmark-controller-db
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: benchmark-controller-db
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: benchmark-controller-db
                  key: DATABASE_PASSWORD
            - name: EXPECTED_NODE_ID
              valueFrom:
                secretKeyRef:
                  name: benchmark-agent-benchmark-node-temp
                  key: NODE_ID
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: benchmark-agent-benchmark-node-temp
                  key: AGENT_TOKEN
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: controller-source
              mountPath: /app
              readOnly: true
      volumes:
        - name: controller-source
          configMap:
            name: benchmark-controller-source
---
apiVersion: v1
kind: Service
metadata:
  name: benchmark-controller
  namespace: benchmark-system
spec:
  type: NodePort
  selector:
    app: benchmark-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 31080
