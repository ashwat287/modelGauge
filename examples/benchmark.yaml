apiVersion: modelgauge.io/v1alpha1
kind: Benchmark
metadata:
  # A readable label; every successful run command starts a new execution.
  name: qwen-baseline-001
spec:
  threads: [1, 2]
  contexts: [512]
  # Stages execute in this order for the selected model.
  stages:
    - profile: standard-cpu
      options:
        warmups: 3
        repetitions: 5
    - profile: node-serving
      options:
        warmups: 2
      config:
        suite: basic
        concurrency: [1, 2]
        requests: 10
        output_tokens: 128
